version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: siga-ilsl-db
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5433:5432"    # porta 5433 no host (5432 já usada por outro sistema)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "siga_user", "-d", "estoque"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: siga-ilsl-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
