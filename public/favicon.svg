<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
    <defs>
        <linearGradient id="boxGrad" x1="8" y1="12" x2="56" y2="56" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="100%" stop-color="#3730a3" />
        </linearGradient>
        <linearGradient id="lidGrad" x1="16" y1="10" x2="48" y2="28" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#818cf8" />
            <stop offset="100%" stop-color="#4f46e5" />
        </linearGradient>
        <filter id="shadow" x="0" y="4" width="64" height="60" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
            <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.3" flood-color="#000" />
        </filter>
    </defs>
    <!-- Background rounded tile -->
    <rect width="64" height="64" rx="14" fill="#0f172a" />
    <rect x="1" y="1" width="62" height="62" rx="13" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    
    <!-- Isometric Supply Box -->
    <g filter="url(#shadow)">
        <!-- Left Face -->
        <path d="M12 26 L32 37 V53 L12 42 Z" fill="#4338ca" />
        <!-- Right Face -->
        <path d="M32 37 L52 26 V42 L32 53 Z" fill="#312e81" />
        <!-- Top Face -->
        <path d="M32 12 L52 23 L32 34 L12 23 Z" fill="url(#lidGrad)" />
        
        <!-- Tape / Seal Band -->
        <path d="M28 14.5 L36 19 L36 39 L28 34.5 Z" fill="#06b6d4" opacity="0.9" />
        
        <!-- Hospital / Plus symbol on front left -->
        <path d="M21 35 H23 V39 H27 V41 H23 V45 H21 V41 H17 V39 H21 Z" fill="#ffffff" opacity="0.95" />
    </g>
</svg>
